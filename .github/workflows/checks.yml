name: Verify prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify_sources.mjs
      - run: node scripts/prepare_data.mjs
      - run: node scripts/verify_workflows.mjs
      - run: node scripts/run_tests.mjs
